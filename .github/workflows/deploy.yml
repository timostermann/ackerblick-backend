name: Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Hetzner
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # NOTE: git pull over HTTPS requires the repo to be public.
            # For a private repo, install a read-only deploy key on the server
            # and switch to: GIT_SSH_COMMAND='ssh -i /root/.ssh/deploy_key' git pull
            cd /opt/ackerblick-backend
            git pull origin main
            docker compose -f docker-compose.prod.yml build app
            docker compose -f docker-compose.prod.yml up -d
