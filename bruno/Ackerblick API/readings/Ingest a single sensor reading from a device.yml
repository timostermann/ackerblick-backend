info:
  name: Ingest a single sensor reading from a device.
  type: http
  seq: 1
  tags:
    - readings

http:
  method: POST
  url: "{{baseUrl}}/v1/readings"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "deviceId": "hochbeet-001",
        "soilMoisture": 42
      }
  auth:
    type: apikey
    key: X-API-Key
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/v1/readings"
      method: POST
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "deviceId": "hochbeet-001",
            "soilMoisture": 42
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "commands": []
          }
  - name: 401 Response
    description: Invalid or missing API key.
    request:
      url: "{{baseUrl}}/v1/readings"
      method: POST
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "deviceId": "hochbeet-001",
            "soilMoisture": 42
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
